---
openapi: 3.0.3
info:
  title: API пересказа YouTube-роликов
  version: 1.0.0
security:
- clientToken: []
paths:
  "/jobs":
    post:
      operationId: createJob
      summary: Создать Job или получить ответ первого запроса
      description: Лимит тела 16 КиБ. Ключ действует в пределах клиента. Повтор с
        тем же ID ролика и режимом возвращает исходный ответ. Другой ID или режим
        с тем же ключом даёт 409.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateJob"
      responses:
        '202':
          description: Job создана или возвращён исходный ответ
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
            Location:
              required: true
              schema:
                type: string
                example: "/jobs/123"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedJob"
        '400':
          "$ref": "#/components/responses/InvalidJson"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          "$ref": "#/components/responses/IdempotencyConflict"
        '413':
          "$ref": "#/components/responses/RequestTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '422':
          "$ref": "#/components/responses/ValidationFailed"
        '500':
          "$ref": "#/components/responses/InternalError"
  "/jobs/{id}":
    parameters:
    - "$ref": "#/components/parameters/JobId"
    get:
      operationId: getJob
      summary: Прочитать состояние и результат своей Job
      responses:
        '200':
          description: Текущее состояние
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Job"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/JobNotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
  "/jobs/{id}/cancel":
    parameters:
    - "$ref": "#/components/parameters/JobId"
    post:
      operationId: cancelJob
      summary: Отменить активную Job или подтвердить отмену
      responses:
        '200':
          description: Job отменена
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CancelledJob"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/JobNotFound"
        '409':
          "$ref": "#/components/responses/JobAlreadyFinished"
        '500':
          "$ref": "#/components/responses/InternalError"
components:
  securitySchemes:
    clientToken:
      type: http
      scheme: bearer
  headers:
    CacheControl:
        required: true
        description: Всегда `no-store`, чтобы ответ нельзя было отдать из кэша другому клиенту
        schema:
          type: string
          enum:
          - no-store
  parameters:
    JobId:
      in: path
      name: id
      required: true
      description: Идентификатор Job из ответа на создание
      schema:
        type: string
        minLength: 1
  responses:
    InvalidJson:
      description: Тело невозможно разобрать как JSON
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_JSON
              message: Тело запроса не является корректным JSON
    Unauthorized:
      description: Токен клиента отсутствует или недействителен
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
        WWW-Authenticate:
          required: true
          schema:
            type: string
            enum:
            - Bearer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: Требуется токен клиента
    JobNotFound:
      description: |
        Job не найдена. Ответ одинаков для чужой, отсутствующей и некорректной по
        формату Job, чтобы нельзя было проверить существование чужих ID.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: JOB_NOT_FOUND
              message: Job не найдена
    JobAlreadyFinished:
      description: |
        Job уже в состоянии `COMPLETED` или `FAILED`. Состояние и результат
        не изменились.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: JOB_ALREADY_FINISHED
              message: Job уже завершена и не может быть отменена
    IdempotencyConflict:
      description: |
        Тот же `Idempotency-Key` уже использован этим клиентом для другого ролика
        или режима. Для нового запроса нужен новый ключ.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: IDEMPOTENCY_CONFLICT
              message: Ключ уже использован для другого запроса
    RequestTooLarge:
      description: Тело превышает 16 КиБ
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: Тело запроса превышает 16 КиБ
    UnsupportedMediaType:
      description: Тип тела отсутствует или отличается от `application/json`
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Ожидается Content-Type application/json
    ValidationFailed:
      description: |
        INVALID_FIELD при нарушении схемы, формата ссылки или ключа.
        UNSUPPORTED_OPERATION с полем operation для неизвестного режима. Если
        ошибка относится к конкретному полю или заголовку, API указывает его имя.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          examples:
            missingUrl:
              value:
                error:
                  code: INVALID_FIELD
                  message: Укажите ссылку
                  field: url
            unknownOperation:
              value:
                error:
                  code: UNSUPPORTED_OPERATION
                  message: Неизвестный режим
                  field: operation
    InternalError:
      description: |
        Непредвиденный сбой сервиса. Внутренние детали (текст исключения, запросы
        к хранилищу) в ответ не попадают. При создании Job повтор с тем же
        `Idempotency-Key` безопасен: Job создаётся не более одного раза.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Внутренняя ошибка сервиса
  schemas:
    CreateJob:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://(?:www\\.youtube\\.com/watch\\?|youtu\\.be/[A-Za-z0-9_-]{11}(?:[?#]|$))"
          description: Для watch требуется ровно один параметр v со значением из 11
            символов A–Z, a–z, 0–9, дефиса или подчёркивания.
          example: https://www.youtube.com/watch?v=abcdefghijk
        operation:
          type: string
          enum:
          - brief
          - timeline
          default: brief
      required:
      - url
      additionalProperties: false
    CreatedJob:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          description: |
            `CREATED` для нового запроса, `COMPLETED` для найденного готового
            результата (S5).
          enum:
          - CREATED
          - COMPLETED
      required:
      - id
      - status
      additionalProperties: false
    CancelledJob:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - CANCELLED
      required:
      - id
      - status
      additionalProperties: false
    Job:
      oneOf:
      - type: object
        properties:
          id:
            type: string
            minLength: 1
          status:
            type: string
            enum:
            - CREATED
            - EXTRACTING_TRANSCRIPT
            - ANALYZING
            - CANCELLED
        required:
        - id
        - status
        additionalProperties: false
      - type: object
        properties:
          id:
            type: string
            minLength: 1
          status:
            type: string
            enum:
            - FAILED
          error:
            type: object
            properties:
              code:
                type: string
                enum:
                - TRANSCRIPT_UNAVAILABLE
                - TRANSCRIPT_TIMEOUT
                - TRANSCRIPT_SOURCE_ERROR
                - TRANSCRIPT_INVALID_RESPONSE
                - TRANSCRIPT_TOO_LARGE
                - ANALYSIS_FAILED
                - ANALYSIS_TIMEOUT
                - PROCESSING_INTERRUPTED
              message:
                type: string
            required:
            - code
            - message
            additionalProperties: false
        required:
        - id
        - status
        - error
        additionalProperties: false
      - type: object
        properties:
          id:
            type: string
            minLength: 1
          status:
            type: string
            enum:
            - COMPLETED
          result:
            oneOf:
            - "$ref": "#/components/schemas/BriefResult"
            - "$ref": "#/components/schemas/TimelineResult"
        required:
        - id
        - status
        - result
        additionalProperties: false
    BriefResult:
      type: object
      properties:
        points:
          type: array
          description: Тезисы ролика в порядке следования
          items:
            type: string
            minLength: 1
          minItems: 1
      required:
      - points
      additionalProperties: false
    TimelineResult:
      type: object
      properties:
        segments:
          type: array
          description: |
            Отрезки в порядке возрастания `startMs`. Значения `startMs` не
            повторяются и взяты из таймкодов субтитров.
          items:
            type: object
            properties:
              startMs:
                type: integer
                minimum: 0
              points:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 1
            required:
            - startMs
            - points
            additionalProperties: false
          minItems: 1
      required:
      - segments
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - UNAUTHORIZED
              - JOB_NOT_FOUND
              - INVALID_JSON
              - REQUEST_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - INVALID_FIELD
              - UNSUPPORTED_OPERATION
              - IDEMPOTENCY_CONFLICT
              - JOB_ALREADY_FINISHED
              - INTERNAL_ERROR
            message:
              type: string
            field:
              type: string
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
